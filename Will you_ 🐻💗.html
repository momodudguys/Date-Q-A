function bear(o){

const FC=['#ff8fc0','#c9a0ff','#ffffff','#ffb86b','#ff6f91','#a9b8ff'];
function flowers(front){const cw=40,i0=Math.floor(sc/cw)-1,i1=Math.floor((sc+W)/cw)+1;for(let i=i0;i<=i1;i++){if(hash(i)>.35+.5*Math.max(0,Math.sin(i*.045)))continue;const off=(.005+hash(i+9)*.13)*H;if((off>.07*H)!==front)continue;
 const sx=i*cw+hash(i+4)*cw-sc,y=layerY(2,sx)+off+H*.02,k=.8+off/H*3.5,r=(6+hash(i+2)*6)*S*k,h=(20+hash(i+7)*22)*S*k,sw=Math.sin(T*1.8+i)*3*S;
 cx.strokeStyle='#5f9e58';cx.lineWidth=2*S;cx.lineCap='round';cx.beginPath();cx.moveTo(sx,y);cx.quadraticCurveTo(sx+sw*.3,y-h*.5,sx+sw,y-h);cx.stroke();bloom(sx+sw,y-h,r,FC[Math.floor(hash(i+3)*6)],'rgba(255,255,255,.85)')}}
let P=[],BF=[];
const addP=(x,y,k,vx,vy,l,r)=>P.push({x,y,k,vx,vy,l,m:l,r,c:pick(['#ff6fa5','#ff8fc0','#ff4f8b','#ffa3c8'])});
function parts(){for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=DT;if(p.l<=0){P.splice(i,1);continue}p.x+=p.vx*DT;p.y+=p.vy*DT;cx.globalAlpha=Math.min(1,p.l/p.m*1.6);if(p.k==='h')heart(p.x,p.y,p.r,p.c);else{cx.fillStyle='#fff2a8';cx.beginPath();cx.moveTo(p.x,p.y-p.r);cx.quadraticCurveTo(p.x,p.y,p.x+p.r,p.y);cx.quadraticCurveTo(p.x,p.y,p.x,p.y+p.r);cx.quadraticCurveTo(p.x,p.y,p.x-p.r,p.y);cx.quadraticCurveTo(p.x,p.y,p.x,p.y-p.r);cx.fill()}}cx.globalAlpha=1}
function butterflies(){if(BF.length<5&&Math.random()<DT*.4)BF.push({x:rnd(0,W),y:rnd(.2,.55)*H,b:0,vx:rnd(-30,50),ph:rnd(0,6),col:pick(['#ffb347','#ff8fc0','#9ad0ff','#c9a0ff']),l:rnd(7,11)});
 for(let i=BF.length-1;i>=0;i--){const f=BF[i];f.l-=DT;f.x+=(f.vx-spd*.25)*DT;if(!f.b)f.b=f.y;f.y=f.b+Math.sin(T*2+f.ph)*24;if(f.l<0||f.x<-40||f.x>W+40){BF.splice(i,1);continue}
  const wg=.25+Math.abs(Math.sin(T*14+f.ph))*.75;cx.save();cx.translate(f.x,f.y);cx.scale(S,S);cx.fillStyle=f.col;for(const k of[-1,1]){cx.beginPath();cx.ellipse(k*7*wg,-3,8*wg,6,k*.4,0,7);cx.fill();cx.beginPath();cx.ellipse(k*5*wg,4,5*wg,4,-k*.4,0,7);cx.fill()}cx.strokeStyle='#5a3a2c';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-6);cx.lineTo(0,7);cx.stroke();cx.restore()}}
/* ---------- state ---------- */
let scene='ask',spd=0,spdT=0,ph=0,tw=0,tp=0,catE=null,catNext=8,pet=0,pk={},ask={emo:'happy',until:0,i:0,wm:1,last:-9};
const bear1={pal:'brown',dir:1,s:1,seed:0},bear2={pal:'white',dir:1,s:1,bow:1,seed:2};
function setScene(s){scene=s;show('bubble',s==='ask');show('askBtns',s==='ask');show('cap',s==='walk'||s==='picnic');show('react',false);if(s!=='walk')show('cont',false);if(s!=='picnic')show('take',false);$('msg').classList.toggle('on',s==='msg')}
function cap_(t){const e=$('cap');if(e.textContent!==t)e.textContent=t}
/* ---------- scene 1: ask ---------- */
const noB=$('no'),REACT=[['shock','wait, what?! 😳'],['sad','...really? 🥺'],['plead','pleeease? 🥹'],['cry','*sniff sniff* 😭'],['angry','hmph!! 😤']];
const mp={x:-999,y:-999},nb={x:0,y:0,vx:0,vy:0,on:0};let rp=-1;
REACT.push(['dizzy','*dizzy* 😵‍💫'],['pout','whyyy 😩'],['wink','catch it if you can 😜']);
addEventListener('pointermove',e=>{mp.x=e.clientX;mp.y=e.clientY});
function reactNo(){let i;do{i=Math.floor(Math.random()*REACT.length)}while(i===rp);rp=i;const r=REACT[i];ask.emo=r[0];ask.until=T+1.8;ask.last=T;const l=$('react');l.textContent=r[1];show('react',true)}
function tele(){const w=noB.offsetWidth,h=noB.offsetHeight;nb.x=mp.x<W/2?rnd(W*.55,W-w-10):rnd(10,W*.4);nb.y=rnd(70,H-h-10);nb.vx=rnd(-300,300);nb.vy=rnd(-300,300)}
['pointerdown','click','touchstart'].forEach(ev=>noB.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();mp.x=e.clientX||mp.x;mp.y=e.clientY||mp.y;tele();if(T>ask.last+.7)reactNo()},{passive:false}));
function runNo(){if(!nb.on){nb.on=1;const r=$('yes').getBoundingClientRect();document.body.appendChild(noB);noB.classList.add('run');nb.x=r.right+30;nb.y=r.top;nb.vx=rnd(-200,200);nb.vy=rnd(-200,200)}
 const w=noB.offsetWidth,h=noB.offsetHeight,dx=nb.x+w/2-mp.x,dy=nb.y+h/2-mp.y,d=Math.hypot(dx,dy)||1;
 if(d<190){nb.vx+=dx/d*5000*DT;nb.vy+=dy/d*5000*DT;if(T>ask.last+1.6)reactNo()}
 if(d<60)tele();
 nb.vx+=Math.cos(T*1.3+1)*220*DT;nb.vy+=Math.sin(T*1.7)*220*DT;
 let sp=Math.hypot(nb.vx,nb.vy)||1;const t2=cl(sp,180,950);nb.vx*=t2/sp;nb.vy*=t2/sp;nb.x+=nb.vx*DT;nb.y+=nb.vy*DT;
 if(nb.x<10){nb.x=10;nb.vx=Math.abs(nb.vx)}if(nb.x>W-w-10){nb.x=W-w-10;nb.vx=-Math.abs(nb.vx)}if(nb.y<50){nb.y=50;nb.vy=Math.abs(nb.vy)}if(nb.y>H-h-10){nb.y=H-h-10;nb.vy=-Math.abs(nb.vy)}
 noB.style.transform=`translate(${nb.x}px,${nb.y}px) rotate(${Math.sin(T*6)*5}deg)`}
$('yes').onclick=startWalk;
function updAsk(){sc+=25*DT;ask.wm=lerp(ask.wm,T<ask.until?0:1,DT*5);if(T>=ask.until)show('react',false);
 const s=S*1.5,x=W/2,y=gY(x)+H*.02;const l=$('react');l.style.top=(y-235*S-H*.03)+'px';
 skyDraw();hill(0);hill(1);hill(2);flowers(false);
 runNo();const k=cl(1-(ask.until-T)/1.8),m=T<ask.until?({shock:{hop:Math.max(0,Math.sin(k*6.28))*14},sad:{hd:8,tilt:.04},cry:{tilt:Math.sin(T*22)*.03,hd:5},angry:{hop:Math.abs(Math.sin(T*10))*7,tilt:Math.sin(T*20)*.02},plead:{tilt:Math.sin(T*3)*.06},dizzy:{tilt:Math.sin(T*5)*.1},pout:{tilt:-.04,hd:3},wink:{hop:Math.abs(Math.sin(T*6))*5,tilt:Math.sin(T*4)*.05}}[ask.emo]||{}):{};
 bear({...bear1,x,y,s,emo:T<ask.until?ask.emo:'happy',hd:m.hd||(1-ask.wm)*6,tilt:m.tilt||0,hop:m.hop||0,armOv:2.5+Math.sin(T*7)*.35,armMix:ask.wm,look:cl((nb.x+40-W/2)/(W/2),-1,1)});flowers(true);butterflies();parts()}
/* ---------- scene 2: walk ---------- */
function startWalk(){setScene('walk');noB.style.display='none';tw=0;sc=0;spd=0;spdT=150;catE=null;catNext=8;pet=0;P=[];BF=[];cap_('yay!! 🎉');$('cont').classList.remove('on')}
$('cont').onclick=startPicnic;
function updWalk(){tw+=DT;spd=lerp(spd,spdT,Math.min(1,DT*3));sc+=spd*DT;ph+=spd*DT*.048;
 const en=ease(cl(tw/2.6)),gap=Math.min(W*.28,190*S),bx=lerp(-110*S,W/2-gap/2,en),wx=lerp(-230*S,W/2+gap/2,en),w=cl(spd/150);
 const by=gY(bx),wy=gY(wx),tl=x=>Math.atan((gY(x+3)-gY(x-3))/6)*.6;
 if(tw>16)show('cont',true);
 let capT=tw<3.2?'yay!! 🎉':lmCaption();cap_(capT);
 if(!catE&&tw>catNext&&tw>en){catE={x:W+80,dir:-1,ph:0,sit:0,st:'in',t:0,purr:0,y:0,hb:0}}
 let target=0;
 if(catE){const c=catE,stop=wx+82*S;c.ph+=DT*9;
  if(c.st==='in'){c.x-=105*DT*S;if(c.x<=stop){c.st='sit';c.t=0;c.sit=1;spdT=0}}
  else if(c.st==='sit'){c.t+=DT;target=c.t>1.2&&c.t<5.2?1:0;c.purr=target;c.hb-=DT;if(target&&c.hb<0){c.hb=.45;addP(c.x-10*S,c.y-60*S,'h',rnd(-15,15),-40,1.4,7*S)}if(c.t>5.6){c.st='out';c.sit=0;c.dir=1;spdT=150}}
  else{c.x+=150*DT*S;if(c.x>W+120){catE=null;catNext=tw+rnd(16,24)}}
  if(catE)c.y=gY(c.x)}
 pet=lerp(pet,target,Math.min(1,DT*5));
 if(Math.random()<DT*.25&&tw>4)addP((bx+wx)/2,by-190*S,'h',rnd(-10,10),-35,1.6,7*S);
 const EM=['happy','joy','love','wink','sparkle','happy'],ei=Math.floor(tw/3.2),e1=tw<3?'joy':EM[ei%6],e2=tw<3?'joy':EM[(ei+2)%6];
 skyDraw();hill(0);landmarks();hill(1);hill(2);flowers(false);
 if(catE)cat(catE);
 bear({...bear1,x:bx,y:by,s:S,walk:w,ph,tilt:tl(bx),emo:e1,look:.9+Math.sin(T)*.1,armMix:0});
 bear({...bear2,x:wx,y:wy,s:S,walk:w*(1-pet),ph:ph+.6,tilt:tl(wx)+pet*.32,emo:pet>.5?'joy':e2,look:lerp(-.9,1,pet),hd:pet*5,armOv:.55+Math.sin(T*9)*.22,armMix:pet});
 flowers(true);butterflies();parts()}
/* ---------- scene 3: picnic ---------- */
function startPicnic(){setScene('picnic');tp=0;sc=420;spd=0;spdT=0;pk={tc:-1,burst:0,nh:0};P=[];BF=[];cap_('a little picnic 🧺')}
$('take').onclick=()=>{pk.tc=tp;show('take',false)};
function blanket(x,y){cx.save();cx.beginPath();cx.moveTo(x-170*S,y-18*S);cx.lineTo(x+170*S,y-18*S);cx.lineTo(x+215*S,y+30*S);cx.lineTo(x-215*S,y+30*S);cx.closePath();cx.shadowColor='rgba(0,0,0,.25)';cx.shadowBlur=18;cx.fillStyle='#fff6f9';cx.fill();cx.shadowBlur=0;cx.clip();cx.fillStyle='#ffc9de';
 for(let i=-10;i<10;i+=2){cx.beginPath();cx.moveTo(x+i*34*S,y-18*S);cx.lineTo(x+(i+1)*34*S,y-18*S);cx.lineTo(x+(i+1)*43*S,y+30*S);cx.lineTo(x+i*43*S,y+30*S);cx.fill()}
 cx.fillStyle='rgba(255,150,190,.25)';cx.fillRect(0,y-2*S,W,10*S);cx.restore();
 cx.fillStyle='#d9a066';cx.beginPath();cx.roundRect(x-24*S,y-30*S,48*S,26*S,6*S);cx.fill();cx.strokeStyle='#a8703a';cx.lineWidth=2*S;cx.beginPath();cx.arc(x,y-30*S,20*S,Math.PI,0);cx.stroke();cx.fillStyle='#ff9ab8';cx.beginPath();cx.roundRect(x-20*S,y-34*S,40*S,6*S,3*S);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(x-150*S,y+12*S,18*S,6*S,0,0,7);cx.fill();cx.fillStyle='#ff4f6d';[-8,0,8].forEach(d=>{cx.beginPath();cx.arc(x-150*S+d*S,y+8*S,5*S,0,7);cx.fill()});
 cx.fillStyle='#d9a066';cx.beginPath();cx.moveTo(x+62*S,y+18*S);cx.lineTo(x+98*S,y+18*S);cx.lineTo(x+92*S,y+4*S);cx.lineTo(x+68*S,y+4*S);cx.fill();cx.fillStyle='#ffb6d9';cx.beginPath();cx.arc(x+80*S,y+2*S,14*S,Math.PI,0);cx.fill();cx.fillStyle='#ff4f6d';cx.beginPath();cx.arc(x+80*S,y-12*S,4*S,0,7);cx.fill();
 cx.fillStyle='rgba(255,170,60,.85)';cx.beginPath();cx.roundRect(x-95*S,y-4*S,14*S,20*S,4*S);cx.fill()}
function updPicnic(){tp+=DT;ph+=DT*6.5;const gp=104*S,x0=W/2,y=gY(x0),e=ease(cl(tp/2.4)),bx=lerp(-90*S,x0-gp/2,e),wx=lerp(W+90*S,x0+gp/2,e),wk=tp<2.3?1:Math.max(0,1-(tp-2.3)*4);
 const u=pk.tc>=0?tp-pk.tc:-1;let bo=.12,wo=.1,bf=0,wf=0,be='happy',we='happy',bl=1,hop=0,blk=0;
 if(tp>=3.6)bf=1;
 if(u<0){if(tp<2.8)bo=.12;else if(tp<3.6){bo=lerp(.12,-1.3,ease((tp-2.8)/.8))}else if(tp<4.7)bo=lerp(-1.3,1.9,ease((tp-3.6)/1.1));else{bo=1.9+Math.sin(T*3)*.05;if(!$('take').classList.contains('on'))show('take',true)}}
 else{bo=u<.9?1.9:lerp(1.9,.15,ease(cl((u-.9)/.8)));if(u>=.6)bf=0;
  wo=u<.8?lerp(.1,1.7,ease(u/.8)):lerp(1.7,2.8,ease(cl((u-.8)/.5)));if(u>1.0)wf=1;
  we=u>1.1?'touched':u>.7?'shock':'happy';if(u>1.1){be='joy';hop=Math.abs(Math.sin(T*7))*6;
   if(!pk.burst){pk.burst=1;for(let i=0;i<14;i++)addP(wx-20*S,y-150*S,Math.random()<.3?'s':'h',rnd(-90,90),rnd(-120,-30),rnd(1.2,2),rnd(6,11)*S)}
   pk.nh-=DT;if(pk.nh<0){pk.nh=.3;addP(wx+rnd(-30,30)*S,y-170*S,'h',rnd(-15,15),-45,1.5,7*S)}}
  if(u>3.4){wf=0;hop=0;bo=2.25+Math.sin(u*7)*.3;wo=2.25+Math.sin(u*7+2)*.3;be=we=Math.sin(u*7)>0?'joy':'happy'}if(u>8.6){bo=wo=3;be='joy';we='love'}if(u>11.5&&scene==='picnic')endScene()}
 skyDraw();hill(0);hill(1);hill(2);flowers(false);blanket(x0,y);if(u>3.4){cx.save();cx.translate(x0+130*S,y+8*S);cx.scale(S,S);held(0,0);cx.restore()}
 const hb=bear({...bear1,x:bx,y,s:S,walk:wk,ph,emo:be,blush:bl,look:.5,armOv:bo,armMix:1,flower:bf,hop});
 const hw=bear({...bear2,x:wx,y,s:S,dir:-1,walk:wk,ph:ph+.6,emo:we,look:.6,hd:u>1.1?Math.sin(T*5)*2:0,armOv:wo,armMix:1,flower:wf,hop:u>1.1&&u<3.4?Math.abs(Math.sin(T*6+1))*3:0});
 if(u>=.6&&u<1.0){const p=ease((u-.6)/.4);cx.save();cx.translate(lerp(hb.x,hw.x,p),lerp(hb.y,hw.y,p));cx.scale(S,S);held(0,0);cx.restore()}
 if(u>=3.4&&u<8.6)[hb,hw].forEach(h=>{cx.fillStyle='#ff4f6d';cx.beginPath();cx.arc(h.x,h.y-3*S,6*S,0,7);cx.fill();cx.fillStyle='#5f9e58';cx.fillRect(h.x-4*S,h.y-10*S,8*S,3*S)});
 flowers(true);butterflies();parts()}
/* ---------- scene 4: message ---------- */
let hearts=null;
function endScene(){setScene('msg');clearInterval(hearts);hearts=setInterval(()=>{const h=document.createElement('div');h.className='rh';h.textContent=pick(['💗','💖','🩷','💕']);h.style.left=Math.random()*100+'%';h.style.setProperty('--hx',(Math.random()*160-80)+'px');h.style.animationDuration=(Math.random()*3+4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),7500)},380)}
$('replay').onclick=()=>{clearInterval(hearts);startWalk()};
/* ---------- loop ---------- */
let last=performance.now();
function frame(n){DT=Math.min(.05,(n-last)/1000);last=n;T+=DT;
 if(scene==='ask')updAsk();else if(scene==='walk')updWalk();else if(scene==='picnic')updPicnic();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
